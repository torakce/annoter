# Builds the Windows downloads and publishes them as a GitHub release.
#
# Release a new version:
#   1. bump `version` in pyproject.toml and `__version__` in
#      src/annoter/__init__.py (a test keeps them equal);
#   2. write the notes in .github/release-notes/vX.Y.Z.md;
#   3. commit, then: git tag -a vX.Y.Z -m "Annoter vX.Y.Z"
#                    git push origin master vX.Y.Z
# Pushing the tag runs this workflow: it builds the single .exe and the
# portable zip on Windows, launches each once (build.py --smoke), and
# attaches both to the release. "Run workflow" (manual) builds without
# publishing; the files are then in the run's artifacts.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-release.txt

      - name: Check version and release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, pathlib, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          project = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )
          version = project["project"]["version"]
          init = pathlib.Path("src/annoter/__init__.py").read_text(encoding="utf-8")
          dunder = re.search(r'__version__ = "([^"]+)"', init).group(1)
          if tag != f"v{version}" or dunder != version:
              raise SystemExit(
                  f"tag {tag} vs pyproject {version} vs __version__ {dunder}"
              )
          notes = pathlib.Path(f".github/release-notes/{tag}.md")
          if not notes.is_file():
              raise SystemExit(f"missing {notes}")

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/requirements-release.txt

      - name: Build the .exe and the portable zip, launch each once
        run: python build.py --onefile --zip-onedir --smoke

      - name: Keep the files with the run
        uses: actions/upload-artifact@v4
        with:
          name: annoter-windows
          path: |
            dist-onefile/Annoter.exe
            dist-onedir/Annoter-portable.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Annoter ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist-onedir/Annoter-portable.zip
            dist-onefile/Annoter.exe
          fail_on_unmatched_files: true
